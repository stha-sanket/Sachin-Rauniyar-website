<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Sachin Official</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS (CDN for static deployment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#E52E2D',
                        'brand-red-hover': '#c42424',
                        'brand-teal': '#20c997',
                        'brand-black': '#030303',
                        'brand-dark': '#0a0a0a'
                    },
                    fontFamily: {
                        'sans': ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Global Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased font-sans flex flex-col min-h-screen relative">

    <!-- Navigation Placeholder -->
    <div id="navbar-placeholder"></div>
    <!-- Main Banner -->
    <section class="mb-32 px-[10%]">
        <div class="relative w-full h-[70vh] md:h-[85vh] overflow-hidden shadow-2xl">
            <img src="assets-images/gallery/Frame4.png" alt="Gallery Banner"
                class="w-full h-full object-cover object-[center_20%]">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                <h1
                    class="mt-[544px] md:mt-[508px] lg:mt-[516px] text-6xl md:text-8xl lg:text-9xl font-bold tracking-tighter gallery-banner-text reveal-up uppercase">
                    Gallery</h1>
            </div>
        </div>
    </section>

    <!-- Photo Grid 1 (Modern Mosaic) -->
    <section class="max-w-[1400px] mx-auto px-4 md:px-8 mb-32">
        <div class="masonry-grid">
            <!-- Col 1 -->
            <div class="flex flex-col gap-6">
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 100ms;">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-scene-of-the-same-man-preserve-exac__29939 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 200ms;">
                    <img src="./assets-images/gallery/7G0A9972 3.png" class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Col 2 -->
            <div class="relative z-20 -mt-8 md:-mt-16 lg:-mt-24 lg:-mb-48">
                <div class="rounded-[2rem] overflow-hidden reveal-up shadow-2xl" style="transition-delay: 300ms;">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-photo-of-the-same-man-from-the-refe__39328 1.png"
                        class="w-full h-[400px] md:h-[500px] lg:h-[700px] object-cover img-hover-effect">
                </div>
            </div>
            <!-- Col 3 (Tallest Center) -->
            <div class="">
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 400ms;">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-scene-of-the-same-man-preserve-exac__29947 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Col 4 -->
            <div class="md:-translate-y-12">
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 500ms;">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-scene-of-the-same-man-preserve-exac__29953 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Col 5 -->
            <div class="flex flex-col gap-6">
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 600ms;">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-cinematic-scene-of-the-same-man-pre__39342 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
                <div class="rounded-[2rem] overflow-hidden reveal-up" style="transition-delay: 700ms;">
                    <img src="./assets-images/gallery/7G0A9972 2.png" class="w-full h-auto img-hover-effect">
                </div>
            </div>
        </div>
    </section>

    <!-- All Time Playlists -->
    <section class="gallery-section max-w-[1400px] mx-auto px-4 md:px-8 mb-40 text-center">
        <h2 class="text-4xl md:text-6xl font-black mb-16 reveal-up tracking-tighter uppercase">All Time Playlists</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Slot 1 -->
            <div class="reveal-up shadow-[0_20px_50px_rgba(229,46,45,0.2)]" style="transition-delay: 100ms;">
                <div class="card-slider">
                    <img src="./assets-images/gallery/alb1 3.png" alt="Playlist 1A">
                    <img src="./assets-images/gallery/album1 3.png" alt="Playlist 1B">
                    <img src="./assets-images/gallery/alb3 3.png" alt="Playlist 1C">
                </div>
            </div>
            <!-- Slot 2 -->
            <div class="reveal-up shadow-[0_20px_50px_rgba(229,46,45,0.2)]" style="transition-delay: 200ms;">
                <div class="card-slider">
                    <img src="./assets-images/gallery/album1 3.png" alt="Playlist 2A">
                    <img src="./assets-images/gallery/alb3 3.png" alt="Playlist 2B">
                    <img src="./assets-images/gallery/alb1 3.png" alt="Playlist 2C">
                </div>
            </div>
            <!-- Slot 3 -->
            <div class="reveal-up shadow-[0_20px_50px_rgba(229,46,45,0.2)]" style="transition-delay: 300ms;">
                <div class="card-slider">
                    <img src="./assets-images/gallery/alb3 3.png" alt="Playlist 3A">
                    <img src="./assets-images/gallery/alb1 3.png" alt="Playlist 3B">
                    <img src="./assets-images/gallery/album1 3.png" alt="Playlist 3C">
                </div>
            </div>
        </div>
    </section>

    <!-- The Sonic Gallery -->
    <section class="max-w-[1400px] mx-auto px-4 md:px-8 mb-32">
        <div class="text-center mb-24">
            <h2 class="text-5xl md:text-7xl font-bold mb-4 reveal-up tracking-tight">The Sonic Gallery</h2>
            <p class="text-white/80 text-lg md:text-xl reveal-up font-medium tracking-wide">Discover music through pictures</p>
        </div>

        <div class="masonry-grid !items-start">
            <!-- Column 1 -->
            <div class="reveal-up md:mt-24 mt-0" style="transition-delay: 100ms;">
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/7G0A9972 1.png" class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Column 2 -->
            <div class="flex flex-col gap-8 reveal-up md:mt-12 mt-0" style="transition-delay: 200ms;">
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/freepik__front-facing-potrait__39335 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/freepik__ultrarealistic-cinematic-shot-of-the-same-man-pres__29942 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Column 3 (Center) -->
            <div class="flex flex-col gap-8 reveal-up" style="transition-delay: 300ms;">
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/freepik__man-preserve-exact-facial-features-identity-skin-t__39340 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/id21 1.png" class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Column 4 -->
            <div class="flex flex-col gap-8 reveal-up md:mt-12 mt-0" style="transition-delay: 400ms;">
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/7G0A9918 1.png" class="w-full h-auto img-hover-effect">
                </div>
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/7G0A9902 1.png" class="w-full h-auto img-hover-effect">
                </div>
            </div>
            <!-- Column 5 -->
            <div class="reveal-up md:mt-24 mt-0" style="transition-delay: 500ms;">
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl">
                    <img src="./assets-images/gallery/freepik__-same-man-preserve-exact-facial-features-identity-__39343 1.png"
                        class="w-full h-auto img-hover-effect">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Modal Placeholder -->
    <div id="modal-placeholder"></div>

    <!-- Combined Scripts -->
    <script src="scripts/include.js"></script>
</body>

</html>

<!-- Album Popup Modal -->
<div id="album-modal" class="fixed inset-0 z-[100] items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-400">
    <div id="album-modal-content"
        class="relative max-w-2xl w-full glass-effect rounded-2xl overflow-hidden shadow-2xl scale-90 transition-transform duration-400">
        <!-- Close Button -->
        <button id="close-modal"
            class="absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-full bg-black/40 text-white hover:bg-brand-red transition-all duration-300">
            <i class="fas fa-times"></i>
        </button>

        <div class="p-2">
            <img src="./assets-images/pop-up.png" alt="Coming Soon" class="w-full h-auto rounded-xl">
        </div>  
    </div>
</div>
